name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. No job here publishes or writes anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag is in the comment). Dependabot
# keeps the pins current.
jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "tests/**/*.{ts,mjs}" "scripts/**/*.mjs"

      # Fails on any high or critical advisory, in shipped or tooling packages.
      - name: Dependency audit
        run: npm run audit

      # Fails when coverage of src/autofill, src/field-detection, src/security
      # or src/parser drops below the thresholds in vitest.config.ts.
      - name: Unit and integration tests, with coverage
        run: npm run test:coverage

      # Fails when classifier or parser precision/recall on the invented corpus
      # drops below tests/corpus/baseline.json.
      - name: Accuracy evaluation
        run: npm run eval

      - name: Build
        run: npm run build

      # Fails on a manifest reference to a missing file, any remote code, a
      # permission outside the agreed set, a non-empty host_permissions, or a
      # weakened CSP. These are the guarantees the product is built on, so they
      # are enforced by the build rather than by review.
      - name: Verify the build
        run: npm run verify

      # Packages the zip and inspects it for anything that must not ship.
      - name: Pre-submission check
        run: node scripts/package.mjs && node scripts/presubmit.mjs --no-build

  windows:
    name: Check on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

  browser:
    name: End-to-end in Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Drives the built extension in Chrome for Testing: real service worker,
      # real shadow DOM, real CSP. jsdom cannot cover any of that, and the one
      # time it was relied on alone it missed a field-mapping bug that affected
      # every flat form.
      - name: End-to-end
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Performance budget
        run: node scripts/perf.mjs
        env:
          CI: 'true'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-dist
          path: dist-e2e/
          retention-days: 5
