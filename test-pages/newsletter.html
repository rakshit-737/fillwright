<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weekly digest — subscribe</title>
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <h1>Subscribe to our newsletter</h1>
    <p class="lead">
      Expected: NOT an application. In Assist or Smart mode Fillwright stays silent here — no
      panel, no pill.
    </p>
    <form>
      <label for="nl-name">Your name</label>
      <input id="nl-name" name="name" autocomplete="name" />
      <label for="nl-email">Email</label>
      <input id="nl-email" name="email" type="email" autocomplete="email" />
      <button type="submit">Subscribe</button>
    </form>
    <script src="./shared.js"></script>
  </body>
</html>
